<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cyber Crime Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050816;
    min-height:100vh;
    padding:40px 20px;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* BACKGROUND EFFECT */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#7c3aed;
    border-radius:50%;
    filter:blur(180px);
    top:-150px;
    left:-150px;
    opacity:0.25;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    border-radius:50%;
    filter:blur(180px);
    bottom:-150px;
    right:-150px;
    opacity:0.25;
}

/* ================= CONTAINER ================= */

.container{
    width:100%;
    max-width:1200px;
    background:#0b1220;
    border-radius:30px;
    display:flex;
    overflow:hidden;
    position:relative;
    z-index:10;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 0 40px rgba(124,58,237,0.2);
}

/* ================= LEFT SIDE ================= */

.left-side{
    flex:1;
    background:linear-gradient(
        135deg,
        #111827,
        #050816
    );

    padding:60px;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.shield{
    width:170px;
    height:170px;

    border-radius:40px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:80px;

    margin-bottom:30px;

    box-shadow:
    0 0 40px rgba(124,58,237,0.4);
}

.left-side h1{
    color:white;
    font-size:42px;
    margin-bottom:20px;
    text-align:center;
}

.left-side p{
    color:#9ca3af;
    text-align:center;
    line-height:1.9;
    max-width:400px;
}

/* ================= RIGHT SIDE ================= */

.right-side{
    flex:1;
    padding:60px;
}

/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:40px;
}

.logo-box{
    width:50px;
    height:50px;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
    color:white;
}

.logo h2{
    color:white;
}

/* TITLE */

.register-title{
    color:white;
    font-size:38px;
    margin-bottom:10px;
}

.subtitle{
    color:#9ca3af;
    margin-bottom:35px;
}

/* ================= FORM ================= */

.row{
    display:flex;
    gap:20px;
}

.form-group{
    margin-bottom:22px;
    flex:1;
}

.form-group label{
    display:block;
    margin-bottom:10px;
    color:#d1d5db;
    font-size:14px;
}

.form-group input{
    width:100%;
    padding:16px;

    border:none;
    outline:none;

    border-radius:14px;

    background:#111827;
    color:white;

    border:1px solid rgba(255,255,255,0.05);

    transition:0.3s;
}

.form-group input:focus{
    border-color:#7c3aed;

    box-shadow:
    0 0 10px rgba(124,58,237,0.3);
}

/* TERMS */

.terms{
    display:flex;
    align-items:flex-start;
    gap:12px;

    margin-bottom:25px;

    color:#9ca3af;
    line-height:1.6;
    font-size:14px;
}

.terms input{
    margin-top:4px;
    accent-color:#7c3aed;
}

/* BUTTON */

.register-btn{
    width:100%;
    padding:16px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color:white;
    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

.register-btn:hover{
    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(124,58,237,0.3);
}

/* LOGIN */

.login-link{
    text-align:center;
    margin-top:25px;
    color:#9ca3af;
}

.login-link a{
    color:#8b5cf6;
    text-decoration:none;
    font-weight:600;
}

/* ================= RESPONSIVE ================= */

@media(max-width:950px){

    .container{
        flex-direction:column;
    }

}

@media(max-width:650px){

    .left-side,
    .right-side{
        padding:35px 25px;
    }

    .row{
        flex-direction:column;
        gap:0;
    }

    .register-title{
        font-size:30px;
    }

    .left-side h1{
        font-size:32px;
    }

    .shield{
        width:120px;
        height:120px;
        font-size:60px;
    }

}

</style>

</head>

<body>

<!-- ================= CONTAINER ================= -->

<div class="container">

    <!-- LEFT -->

    <div class="left-side">

        <div class="shield">
            🛡
        </div>

        <h1>
            Cyber Crime Portal
        </h1>

        <p>
            Register securely to report
            cyber crimes, upload evidence,
            and track complaints in real-time.
        </p>

    </div>

    <!-- RIGHT -->

    <div class="right-side">

        <!-- LOGO -->

        <div class="logo">

            <div class="logo-box">
                🔐
            </div>

            <h2>
                Cyber Crime
            </h2>

        </div>

        <!-- TITLE -->

        <h1 class="register-title">
            Create Account
        </h1>

        <p class="subtitle">
            Register to access the cyber security portal
        </p>

        <!-- FORM -->

        <form onsubmit="registerUser(event)">

            <!-- ROW -->

            <div class="row">

                <!-- FIRST NAME -->

                <div class="form-group">

                    <label>First Name</label>

                    <input
                    type="text"
                    id="firstName"
                    placeholder="Enter first name"
                    required>

                </div>

                <!-- LAST NAME -->

                <div class="form-group">

                    <label>Last Name</label>

                    <input
                    type="text"
                    id="lastName"
                    placeholder="Enter last name"
                    required>

                </div>

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label>Email Address</label>

                <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            </div>

            <!-- PHONE -->

            <div class="form-group">

                <label>Phone Number</label>

                <input
                type="text"
                id="phone"
                placeholder="Enter phone number"
                required>

            </div>

            <!-- PASSWORD ROW -->

            <div class="row">

                <!-- PASSWORD -->

                <div class="form-group">

                    <label>Password</label>

                    <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required>

                </div>

                <!-- CONFIRM -->

                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>

                </div>

            </div>

            <!-- ADDRESS -->

            <div class="form-group">

                <label>Address</label>

                <input
                type="text"
                id="address"
                placeholder="Enter your address"
                required>

            </div>

            <!-- AADHAR -->

            <div class="form-group">

                <label>Aadhar Number</label>

                <input
                type="text"
                id="aadhar"
                placeholder="Enter Aadhar number"
                required>

            </div>

            <!-- TERMS -->

            <div class="terms">

                <input type="checkbox" required>

                <span>
                    I agree to the Terms &
                    Conditions and Privacy Policy
                </span>

            </div>

            <!-- BUTTON -->

            <button
            type="submit"
            class="register-btn">

                Create Account

            </button>

        </form>

        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login Here
            </a>

        </div>

    </div>

</div>

<!-- ================= JAVASCRIPT ================= -->

<script>

function registerUser(event){

    /* STOP REFRESH */

    event.preventDefault();

    /* GET VALUES */

    const firstName =
    document.getElementById(
        "firstName"
    ).value;

    const lastName =
    document.getElementById(
        "lastName"
    ).value;

    const email =
    document.getElementById(
        "email"
    ).value;

    const phone =
    document.getElementById(
        "phone"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    const confirmPassword =
    document.getElementById(
        "confirmPassword"
    ).value;

    const address =
    document.getElementById(
        "address"
    ).value;

    const aadhar =
    document.getElementById(
        "aadhar"
    ).value;

    /* PASSWORD CHECK */

    if(password !== confirmPassword){

        alert(
            "Passwords Do Not Match!"
        );

        return;

    }

    /* FULL NAME */

    const fullName =
    firstName + " " + lastName;

    /* SAVE DATA */

    localStorage.setItem(
        "userName",
        fullName
    );

    localStorage.setItem(
        "userEmail",
        email
    );

    localStorage.setItem(
        "userPhone",
        phone
    );

    localStorage.setItem(
        "userPassword",
        password
    );

    localStorage.setItem(
        "userAddress",
        address
    );

    localStorage.setItem(
        "userAadhar",
        aadhar
    );

    /* LOGIN SESSION */

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );

    /* SUCCESS */

    alert(
        "Registration Successful!"
    );

    /* REDIRECT */

    window.location.href =
    "dashboard.html";

}

</script>

</body>
</html>
