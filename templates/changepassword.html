<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#050816;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
    position:relative;
}

/* BACKGROUND EFFECT */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#7c3aed;
    border-radius:50%;
    filter:blur(180px);
    top:-150px;
    left:-150px;
    opacity:0.25;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    border-radius:50%;
    filter:blur(180px);
    bottom:-150px;
    right:-150px;
    opacity:0.25;
}

/* CARD */

.password-card{
    width:100%;
    max-width:500px;
    background:#0b1220;
    border-radius:30px;
    padding:45px;
    position:relative;
    z-index:10;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 0 40px rgba(124,58,237,0.2);
}

/* HEADER */

.top-icon{
    width:100px;
    height:100px;
    margin:auto;
    margin-bottom:25px;
    border-radius:30px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
}

.password-card h1{
    text-align:center;
    margin-bottom:15px;
}

.password-card p{
    text-align:center;
    color:#9ca3af;
    margin-bottom:35px;
    line-height:1.7;
}

/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    margin-bottom:10px;
    color:#d1d5db;
    font-size:14px;
}

.form-group input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#111827;
    color:white;
    outline:none;
    border:1px solid rgba(255,255,255,0.05);
    transition:0.3s;
}

.form-group input:focus{
    border-color:#7c3aed;
    box-shadow:0 0 12px rgba(124,58,237,0.3);
}

/* BUTTON */

.change-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.change-btn:hover{
    transform:translateY(-3px);
}

/* MESSAGE */

.message{
    margin-top:20px;
    text-align:center;
    color:#10b981;
    display:none;
}

/* RESPONSIVE */

@media(max-width:600px){

    .password-card{
        padding:30px 22px;
    }

    .password-card h1{
        font-size:28px;
    }

}

</style>
</head>

<body>

<!-- PASSWORD CARD -->

<div class="password-card">

    <div class="top-icon">
        🔒
    </div>

    <h1>Change Password</h1>

    <p>
        Update your password securely for better
        account protection and cyber safety.
    </p>

    <!-- FORM -->

    <form id="passwordForm">

        <div class="form-group">

            <label>Current Password</label>

            <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password"
                required
            >

        </div>

        <div class="form-group">

            <label>New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
            >

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >

        </div>

        <button type="submit" class="change-btn">
            Change Password
        </button>

        <div class="message" id="successMessage">
            Password Changed Successfully!
        </div>

    </form>

</div>

<!-- JAVASCRIPT -->

<script>

const form =
document.getElementById("passwordForm");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const currentPassword =
    document.getElementById("currentPassword").value;

    const newPassword =
    document.getElementById("newPassword").value;

    const confirmPassword =
    document.getElementById("confirmPassword").value;

    /* GET OLD PASSWORD */

    const savedPassword =
    localStorage.getItem("userPassword");

    /* CHECK CURRENT PASSWORD */

    if(currentPassword !== savedPassword){

        alert("Current Password Incorrect!");

        return;

    }

    /* CHECK MATCH */

    if(newPassword !== confirmPassword){

        alert("New Passwords Do Not Match!");

        return;

    }

    /* SAVE NEW PASSWORD */

    localStorage.setItem(
        "userPassword",
        newPassword
    );

    document.getElementById(
        "successMessage"
    ).style.display = "block";

    form.reset();

});

</script>

</body>
</html>
